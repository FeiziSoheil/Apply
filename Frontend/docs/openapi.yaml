openapi: 3.1.0
info:
  title: Apply — Student Agency API
  version: 1.0.0
  description: "قرارداد API موسسه اعزام دانشجو. منبع حقیقت: schemaهای Zod در `src/contracts`. قراردادها در `docs/api-conventions.md` توضیح داده شده‌اند."
servers:
  - url: /api/v1
    description: نسخه ۱
tags:
  - name: Auth
    description: احراز هویت و کاربر جاری
  - name: Users
    description: مدیریت کاربران کارمند و نشست‌های حساب
  - name: Settings
    description: تنظیمات موسسه (اطلاعات، تماس، SEO، پیامک)
  - name: Countries
    description: کشورهای مقصد
  - name: Universities
    description: دانشگاه‌ها
  - name: Programs
    description: برنامه‌های تحصیلی
  - name: Services
    description: خدمات موسسه
  - name: Consultants
    description: مشاوران
  - name: Success stories
    description: داستان‌های موفقیت
  - name: Blog
    description: مقاله‌های وبلاگ
  - name: News
    description: اخبار و رویدادها
  - name: FAQ
    description: پرسش‌های متداول
  - name: Leads
    description: سرنخ‌ها، پایپ‌لاین فروش و فعالیت‌ها
  - name: CRM
    description: نماهای ذخیره‌شده و ابزارهای مشترک CRM
  - name: CRM Settings
    description: پایپ‌لاین، تگ، دلیل ریزش، قوانین تخصیص، قالب‌ها
  - name: Tasks
    description: کارها و یادآورها
  - name: Notifications
    description: اعلان‌های کاربر جاری
  - name: Audit
    description: گزارش حسابرسی (فقط admin)
  - name: Reports
    description: گزارش‌های قیف، مشاور، منبع و سری زمانی
  - name: Availability
    description: ساعات کاری مشاوران و تعطیلات سراسری
  - name: Bookings
    description: رزرو وقت مشاوره
  - name: Cases
    description: پرونده‌های دانشجویی و مراحل
  - name: Documents
    description: مدارک پرونده
  - name: Checklist
    description: چک‌لیست مدارک و اقدامات
  - name: Files
    description: آپلود فایل
  - name: Tickets
    description: تیکت‌های پشتیبانی
  - name: Invoices
    description: فاکتورها
  - name: Installments
    description: اقساط و پرداخت
  - name: Student panel
    description: نمای دانشجو، شورت‌لیست، اعلان‌ها و پرداخت پنل
  - name: Announcements
    description: اعلان‌های موسسه (CMS)
  - name: Finance
    description: خلاصه و تراکنش‌های مالی کارکنان
  - name: Stats
    description: آمار داشبورد مدیریت و مشاوران
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: "کوکی httpOnly با نام `session` که بک‌اند هنگام ورود (`POST /auth/otp/verify` یا `POST /auth/login`) با `Set-Cookie` تنظیم و هنگام خروج پاک می‌کند. کلاینت فقط با `credentials: include` آن را ارسال می‌کند و هرگز مقدارش را نمی‌خواند یا در JS ذخیره نمی‌کند. هدر `Authorization` پذیرفته نمی‌شود."
  schemas:
    OtpRequestResult:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          minimum: 1
          example: 120
        resendAfterSeconds:
          type: integer
          minimum: 0
          example: 60
      required:
        - expiresInSeconds
        - resendAfterSeconds
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - total
        - totalPages
    ResponseMeta:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        requestId:
          type: string
    OtpRequestResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OtpRequestResult"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL
    ConflictReason:
      type: string
      enum:
        - version_mismatch
      description: دلیل ماشین‌خوان تعارض؛ فقط برای `CONFLICT`
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: پیام قابل نمایش به کاربر (فارسی)
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: خطاهای هر فیلد؛ کلید = مسیر فیلد (مثلاً `address.city`)
            reason:
              $ref: "#/components/schemas/ConflictReason"
            currentVersion:
              type: integer
              minimum: 1
              description: نسخه فعلی منبع وقتی `reason = version_mismatch`؛ کلاینت باید با این نسخه UI را تازه کند
          required:
            - code
            - message
      required:
        - error
    OtpRequest:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^09\d{9}$
          example: "09123456789"
      required:
        - mobile
    CaseLinkStatus:
      type: string
      enum:
        - linked
        - select
        - none
    DegreeLevel:
      type: string
      enum:
        - bachelor
        - master
        - phd
        - language
        - foundation
    CaseLinkOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        code:
          type: string
        studentName:
          type: string
        currentStageTitle:
          type: string
        targetCountry:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          example: tu-munich
        targetDegree:
          $ref: "#/components/schemas/DegreeLevel"
      required:
        - id
        - code
        - studentName
        - currentStageTitle
        - targetCountry
        - targetDegree
    CaseLinkResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CaseLinkStatus"
        message:
          type: string
          maxLength: 300
        cases:
          type: array
          items:
            $ref: "#/components/schemas/CaseLinkOption"
          default: []
        activeCaseId:
          type:
            - string
            - "null"
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
      required:
        - status
    Role:
      type: string
      enum:
        - admin
        - consultant
        - student
    Permission:
      type: string
      enum:
        - content:read
        - content:write
        - content:delete
        - lead:read
        - lead:write
        - lead:assign
        - lead:delete
        - lead:import
        - lead:export
        - lead:merge
        - student:read
        - student:write
        - student:stage
        - case:read
        - case:write
        - case:review
        - document:upload
        - document:review
        - task:read
        - task:write
        - booking:read
        - booking:write
        - booking:manage
        - ticket:read
        - ticket:write
        - ticket:manage
        - payment:read
        - payment:write
        - payment:manage
        - report:read
        - crm-settings:manage
        - audit:read
        - user:manage
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        mobile:
          type: string
          pattern: ^09\d{9}$
          example: "09123456789"
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
      required:
        - id
        - name
        - role
        - permissions
    Session:
      type: object
      properties:
        expiresIn:
          type: integer
          minimum: 1
          description: اعتبار نشست (کوکی `session`) به ثانیه
        isNewUser:
          type: boolean
          description: "در ورود با OTP: حساب جدید ساخته شده است"
        caseLink:
          $ref: "#/components/schemas/CaseLinkResult"
        user:
          $ref: "#/components/schemas/CurrentUser"
      required:
        - expiresIn
        - user
    SessionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Session"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    OtpVerify:
      type: object
      properties:
        mobile:
          type: string
          pattern: ^09\d{9}$
          example: "09123456789"
        code:
          type: string
          pattern: ^\d{6}$
          example: "123456"
      required:
        - mobile
        - code
    StaffLogin:
      type: object
      properties:
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - email
        - password
    CurrentUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    UpdateProfile:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
    StaffRole:
      type: string
      enum:
        - admin
        - consultant
    UserStatus:
      type: string
      enum:
        - active
        - inactive
    StaffUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-10-18T20:25:00.000Z
        createdAt:
          type: string
          format: date-time
          example: 2026-10-18T20:25:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-18T20:25:00.000Z
      required:
        - id
        - name
        - email
        - role
        - status
        - lastLoginAt
        - createdAt
        - updatedAt
    StaffUsersPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffUser"
        meta:
          type: object
          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"
          required:
            - pagination
      required:
        - data
        - meta
    SortOrder:
      type: string
      enum:
        - asc
        - desc
      default: asc
    InviteUserResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/StaffUser"
        temporaryPassword:
          type: string
          minLength: 8
          description: رمز موقت یک‌بارمصرف؛ فقط در پاسخ ایجاد/بازنشانی برمی‌گردد
      required:
        - user
        - temporaryPassword
    InviteUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InviteUserResult"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    InviteUser:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
        role:
          $ref: "#/components/schemas/StaffRole"
      required:
        - name
        - email
        - role
    StaffUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/StaffUser"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    UpdateStaffUser:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/UserStatus"
    ResetPasswordResult:
      type: object
      properties:
        temporaryPassword:
          type: string
          minLength: 8
      required:
        - temporaryPassword
    ResetPasswordResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ResetPasswordResult"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        createdAt:
          type: string
          format: date-time
          example: 2026-10-18T20:25:00.000Z
        lastSeenAt:
          type: string
          format: date-time
          example: 2026-10-18T20:25:00.000Z
        ipAddress:
          type: string
          minLength: 1
          maxLength: 64
        userAgent:
          type: string
          minLength: 1
          maxLength: 300
        current:
          type: boolean
          description: نشست درخواست جاری
      required:
        - id
        - createdAt
        - lastSeenAt
        - ipAddress
        - userAgent
        - current
    UserSessionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserSession"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    ChangePassword:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "[a-z]"
      required:
        - currentPassword
        - newPassword
    HomepageStat:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        value:
          type: integer
          minimum: 0
          maximum: 1000000000
        suffix:
          type: string
          maxLength: 8
          default: ""
      required:
        - label
        - value
    InstituteInfo:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        nameEn:
          type: string
          minLength: 2
          maxLength: 80
        tagline:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 2000
        logoFileId:
          type:
            - string
            - "null"
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        foundingYear:
          type: integer
          minimum: 1300
          maximum: 2100
          description: سال میلادی تأسیس
        homepageStats:
          type: array
          items:
            $ref: "#/components/schemas/HomepageStat"
          minItems: 1
          maxItems: 8
          description: آمار نوار صفحهٔ اصلی
      required:
        - name
        - nameEn
        - tagline
        - description
        - logoFileId
        - foundingYear
        - homepageStats
    ContactPhone:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        number:
          type: string
          minLength: 5
          maxLength: 32
        href:
          type: string
          minLength: 1
          maxLength: 64
          description: مثلاً tel:+9821…
      required:
        - label
        - number
        - href
    InstituteContact:
      type: object
      properties:
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
          minItems: 1
          maxItems: 6
        email:
          type: string
          maxLength: 120
          format: email
          example: user@example.com
        address:
          type: string
          minLength: 5
          maxLength: 300
        workingHours:
          type: string
          minLength: 3
          maxLength: 200
        coordinates:
          type: object
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
          required:
            - lat
            - lng
      required:
        - phones
        - email
        - address
        - workingHours
        - coordinates
    InstituteSocial:
      type: object
      properties:
        instagram:
          type: string
        telegram:
          type: string
        linkedin:
          type: string
        whatsapp:
          type: string
          description: لینک wa.me یا مشابه
        website:
          type: string
      required:
        - instagram
        - telegram
        - linkedin
        - whatsapp
        - website
    LicenseBadge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        title:
          type: string
          minLength: 1
          maxLength: 80
        imageFileId:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        href:
          type: string
          maxLength: 300
          default: "#"
        order:
          type: integer
          minimum: 0
          maximum: 999
      required:
        - id
        - title
        - imageFileId
        - order
    InstituteSeo:
      type: object
      properties:
        defaultTitle:
          type: string
          minLength: 1
          maxLength: 120
        titleTemplate:
          type: string
          minLength: 1
          maxLength: 120
          description: مثلاً ‎%s | اِپلای‎
        defaultDescription:
          type: string
          minLength: 1
          maxLength: 320
        ogImageFileId:
          type:
            - string
            - "null"
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
      required:
        - defaultTitle
        - titleTemplate
        - defaultDescription
        - ogImageFileId
    SmsTemplateKey:
      type: string
      enum:
        - booking_confirm
        - booking_reminder
        - welcome
        - password_reset
    SmsTemplate:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/SmsTemplateKey"
        label:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          minLength: 1
          maxLength: 500
        variables:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          description: متغیرهای مجاز مثل name و date — فقط خواندنی
      required:
        - key
        - label
        - body
        - variables
    PaymentAccountSettings:
      type:
        - object
        - "null"
      properties:
        cardNumber:
          type: string
          pattern: ^\d{16}$
        accountHolder:
          type: string
          minLength: 2
          maxLength: 80
        bankName:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 80
          default: null
      default: null
      required:
        - cardNumber
        - accountHolder
    InstituteSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        info:
          $ref: "#/components/schemas/InstituteInfo"
        contact:
          $ref: "#/components/schemas/InstituteContact"
        social:
          $ref: "#/components/schemas/InstituteSocial"
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/LicenseBadge"
        seo:
          $ref: "#/components/schemas/InstituteSeo"
        smsTemplates:
          type: array
          items:
            $ref: "#/components/schemas/SmsTemplate"
        paymentAccount:
          $ref: "#/components/schemas/PaymentAccountSettings"
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-18T20:25:00.000Z
      required:
        - id
        - info
        - contact
        - social
        - licenses
        - seo
        - smsTemplates
        - updatedAt
    InstituteSettingsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstituteSettings"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    InstituteInfoResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstituteInfo"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    InstituteContactResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstituteContact"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    InstituteSocialResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstituteSocial"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    InstituteLicensesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LicenseBadge"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
    LicenseBadgeInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: برای مورد جدید خالی بگذارید
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        title:
          type: string
          minLength: 1
          maxLength: 80
        imageFileId:
          type: string
          format: uuid
          example: 3f2b8c4e-6a1d-4e0b-9c57-8d2f1a7b9e10
        href:
          type: string
          maxLength: 300
          default: "#"
        order:
          type: integer
          minimum: 0
          maximum: 999
      required:
        - title
        - imageFileId
        - order
    InstituteLicenses:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LicenseBadgeInput"
          maxItems: 12
      required:
        - items
    InstituteSeoResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstituteSeo"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
      required:
        - data
