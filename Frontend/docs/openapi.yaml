          required: false
          name: excludeId
          in: query
      responses:
        "200":
          description: نتیجهٔ بررسی یکتایی اسلاگ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountrySlugAvailabilityResponse"
        "400":
          description: "`VALIDATION_ERROR` — داده‌های ورودی نامعتبر است"
          content:
            application/json:
              schema:
