      summary: بررسی یکتایی اسلاگ کشور
      description: |-
        برای فرم ایجاد/ویرایش: آیا اسلاگ آزاد است؟ هنگام ویرایش با `excludeId` اسلاگ فعلی را از بررسی کنار بگذارید.

        **دسترسی:** نیازمند ورود — نقش‌های مجاز: مدیر (admin) — مجوز لازم: `content:write`
      security:
        - sessionCookie: []
      x-auth: true
      x-roles:
        - admin
      x-permission: content:write
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            example: tu-munich
          required: true
          name: slug
          in: query
        - schema:
            type: string
            format: uuid
